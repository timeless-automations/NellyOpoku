<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeless X | Timeless Automations</title>
  <link rel="canonical" href="https://timelessautomations.be/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=/">
  <script>
    (function () {
      function detectLang() {
        try {
          var q = new URLSearchParams(window.location.search).get("lang");
          if (q === "fr" || q === "en" || q === "nl") return q;
        } catch (e) {}
        try {
          var keys = ["language", "preferred-language", "video-lang", "demo-lang"];
          for (var i = 0; i < keys.length; i++) {
            var v = localStorage.getItem(keys[i]);
            if (v === "fr" || v === "en" || v === "nl") return v;
          }
        } catch (e) {}
        return null;
      }
      var lang = detectLang();
      var dest = "/";
      if (lang) dest += "?lang=" + encodeURIComponent(lang);
      window.location.replace(dest);
    })();
  </script>
</head>
<body>
  <p><a href="/">Timeless X — Timeless Automations</a></p>
</body>
</html>
